name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - '**/*.tex'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra \
                                  texlive-latex-recommended texlive-fonts-recommended \
                                  texlive-lang-german

      - name: Build changed PDFs
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_TEX=$(git diff --name-only HEAD~1 HEAD -- '*.tex' 2>/dev/null || true)
          else
            CHANGED_TEX=$(git diff --name-only "$BEFORE" HEAD -- '*.tex')
          fi
          for tex in $CHANGED_TEX; do
            if [ -f "$tex" ]; then
              echo "Building $tex"
              make TEX="$tex"
            fi
          done

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-build PDFs [skip ci]"
          git push
